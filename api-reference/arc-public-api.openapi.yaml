          title: Model
          type: string
        worker:
          minLength: 1
          title: Worker
          type: string
        provider:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Provider
        thinking:
          $ref: '#/components/schemas/Thinking'
        checkpoint:
          anyOf:
