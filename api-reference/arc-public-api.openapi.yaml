        detail:
          description: A message saying what went wrong.
          type: string
      required:
      - detail
      title: DecisionsError
      type: object
    DecisionsValidationError:
      description: TypeSafe's `422` body. The error code is in each entry's `type` and in the `x-rayline-error-code`
        header.
      properties:
        detail:
          items:
            properties:
              loc:
                description: Where the problem is, such as `["body", "questions", "urgency"]`.
                items:
                  oneOf:
                  - type: string
                  - type: integer
                type: array
              msg:
                description: What went wrong.
                type: string
              type:
                description: The error code.
                type: string
            required:
            - loc
            - msg
            - type
            type: object
          type: array
      required:
      - detail
      title: DecisionsValidationError
      type: object
