    DecisionsQuestion:
      discriminator:
        propertyName: type
        mapping:
          noul: '#/components/schemas/DecisionsNoulQuestion'
          choice: '#/components/schemas/DecisionsChoiceQuestion'
          score: '#/components/schemas/DecisionsScoreQuestion'
      oneOf:
      - $ref: '#/components/schemas/DecisionsNoulQuestion'
      - $ref: '#/components/schemas/DecisionsChoiceQuestion'
      - $ref: '#/components/schemas/DecisionsScoreQuestion'
      title: DecisionsQuestion
    DecisionsNoulQuestion:
      additionalProperties: false
      properties:
        type:
          const: noul
          type: string
        instructions:
          $ref: '#/components/schemas/DecisionsInstructions'
        criteria:
          additionalProperties: false
          description: What a true and a false answer mean. Each defaults to the word itself.
          properties:
            'true':
              description: What a true answer means. An object or array is read as JSON text.
            'false':
              description: What a false answer means. An object or array is read as JSON text.
          type: object
      required:
      - type
      title: DecisionsNoulQuestion
      type: object
    DecisionsChoiceQuestion:
      additionalProperties: false
      properties:
        type:
          const: choice
          type: string
        instructions:
          $ref: '#/components/schemas/DecisionsInstructions'
        criteria:
          additionalProperties:
            description: The option's description, or null for none. An object or array is read as JSON text.
          description: 1 to 64 options, each a non-empty option name mapped to its description.
          maxProperties: 64
          minProperties: 1
          type: object
      required:
      - type
      - criteria
      title: DecisionsChoiceQuestion
      type: object
    DecisionsScoreQuestion:
      additionalProperties: false
      properties:
        type:
          const: score
          type: string
        instructions:
          $ref: '#/components/schemas/DecisionsInstructions'
        criteria:
          description: 1 to 10 levels, ordered low to high. Each is a description (not null); an object or array is
            read as JSON text.
          items:
            not:
