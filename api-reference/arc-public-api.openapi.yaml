      - arc-decisions-contributor-0.1
      - arc-decisions-zdr-0.1
      title: DecisionsModel
      type: string
    DecisionsRequest:
      additionalProperties: false
      properties:
        model:
          $ref: '#/components/schemas/DecisionsModel'
