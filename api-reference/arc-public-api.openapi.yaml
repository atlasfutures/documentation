    ResultTemperature:
      additionalProperties: false
      description: 'One result''s exploration: its own distribution and draw (``u = draw(salt, decision_key, result_name)``).


        ``greedy``: T 0 was asked. ``applied``: the model was drawn at ``applied`` T; ``propensity`` is pi(chosen).

        ``not_applied``: served greedy for ``reason``. ``unsupported``: the serving path did not report applying it, so

        every draw field is null and the result is the greedy one.'
      properties:
        requested:
          minimum: 0
          title: Requested
          type: number
        applied:
          anyOf:
          - minimum: 0
            type: number
          - type: 'null'
          title: Applied
        status:
          enum:
          - greedy
          - applied
          - not_applied
          - unsupported
          title: Status
          type: string
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        propensity:
          anyOf:
          - exclusiveMinimum: 0
            maximum: 1
            type: number
          - type: 'null'
          title: Propensity
        explored:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Explored
        pi:
          anyOf:
