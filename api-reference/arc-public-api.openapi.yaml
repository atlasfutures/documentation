      type: object
    DecisionsAnswer:
      discriminator:
        propertyName: type
        mapping:
          noul: '#/components/schemas/DecisionsNoulAnswer'
          choice: '#/components/schemas/DecisionsChoiceAnswer'
          score: '#/components/schemas/DecisionsScoreAnswer'
      oneOf:
      - $ref: '#/components/schemas/DecisionsNoulAnswer'
      - $ref: '#/components/schemas/DecisionsChoiceAnswer'
      - $ref: '#/components/schemas/DecisionsScoreAnswer'
      title: DecisionsAnswer
    DecisionsNoulAnswer:
      properties:
        type:
          const: noul
          type: string
        noul:
          description: The probability, from 0 to 1, that the answer is true.
          maximum: 1
          minimum: 0
          type: number
      required:
      - type
      - noul
      title: DecisionsNoulAnswer
      type: object
    DecisionsChoiceAnswer:
      properties:
        type:
          const: choice
          type: string
        choice:
          description: The option name with the highest probability.
          type: string
        confidence:
          description: (p_max - 1/n) / (1 - 1/n) over n options; 1 when there is one option.
          maximum: 1
          minimum: 0
          type: number
        probabilities:
          additionalProperties:
            type: number
          description: Each option name's probability; they sum to 1.
          type: object
      required:
      - type
      - choice
      - confidence
      - probabilities
      title: DecisionsChoiceAnswer
      type: object
    DecisionsScoreAnswer:
      properties:
        type:
          const: score
          type: string
        score:
          description: The expected level, sum of i * p_i, from 0 (the first level) to n - 1.
          type: number
        confidence:
          description: 'max(0, 1 - sum_i p_i |i - m| / U): m the most likely level, U the same spread under a uniform
            distribution. 1 when there is one level.'
          maximum: 1
          minimum: 0
          type: number
        legend:
          additionalProperties:
            type: string
          description: Each level's key ("0" to "n-1") mapped to the level you sent.
          type: object
        probabilities:
          additionalProperties:
            type: number
          description: Each level's probability, keyed "0" to "n-1"; they sum to 1.
          type: object
      required:
      - type
      - score
      - confidence
      - legend
      - probabilities
      title: DecisionsScoreAnswer
      type: object
    DecisionsError:
