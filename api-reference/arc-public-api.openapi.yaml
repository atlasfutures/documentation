openapi: 3.1.0
info:
  title: Rayline ARC public API
  version: 0.1.0
  description: 'ARC model IDs, routing extensions, the Generation API, the Routes API, and the Decisions API. Generation API endpoints document ARC-specific fields; use the corresponding protocol schema for the complete request body.'
servers:
- url: https://api.rayline.ai
security:
- raylineApiKey: []
x-arc-model-ids:
  canonical:
    arc-swift-1.0:
      mode: tier
      tier: swift
      v_value: 0.1
    arc-sage-1.0:
      mode: tier
      tier: sage
      v_value: 4.5
    arc-1.0:
      mode: configurable
      tier: null
      v_value: null
  description: 'A mode entry is its product run in a data mode of its own, whatever the organization''s setting: it decides
    exactly as its product does. A Contributor entry is refused with 403 contributor_models_off in an organization with Contributor
    models off. On Rayline API traffic (an rlk- key, or a Platform token naming X-Rayline-Org) the ARC id decides the mode:
    a product id runs in standard, and an organization in Zero data retention may name only the product''s ZDR entry; any
    other ARC id is refused with 403 zdr_model_required.'
  mode_entries:
    arc-swift-contributor-1.0:
      product: arc-swift-1.0
      data_mode: contributor
    arc-swift-zdr-1.0:
      product: arc-swift-1.0
      data_mode: zdr
    arc-sage-contributor-1.0:
      product: arc-sage-1.0
      data_mode: contributor
    arc-sage-zdr-1.0:
      product: arc-sage-1.0
      data_mode: zdr
    arc-contributor-1.0:
      product: arc-1.0
      data_mode: contributor
    arc-zdr-1.0:
      product: arc-1.0
      data_mode: zdr
  aliases:
    arc-1: arc-1.0
  x-status: proposed
x-arc-result-names:
- swift
- sage
- custom
x-arc-value-usd-bounds:
- 0.1
- 30.0
x-arc-error-codes:
  invalid_body:
    status: 400
    type: invalid_request_error
  unknown_model:
    status: 400
    type: invalid_request_error
  routing_invalid:
    status: 400
    type: invalid_request_error
  routing_unknown_member:
    status: 400
    type: invalid_request_error
  value_invalid:
    status: 400
    type: invalid_request_error
  value_out_of_bounds:
    status: 400
    type: invalid_request_error
  tier_value_immutable:
    status: 400
    type: invalid_request_error
  value_not_accepted:
    status: 400
    type: invalid_request_error
  value_required:
    status: 400
    type: invalid_request_error
  arc_model_required:
    status: 400
    type: invalid_request_error
  temperature_invalid:
    status: 400
    type: invalid_request_error
  prices_invalid:
    status: 400
    type: invalid_request_error
  price_leg_invalid:
    status: 400
    type: invalid_request_error
  models_invalid:
    status: 400
    type: invalid_request_error
  no_candidate_models:
    status: 400
    type: invalid_request_error
  routes_only_member:
    status: 400
    type: invalid_request_error
  price_profile_invalid:
    status: 400
    type: invalid_request_error
  unknown_price_model:
    status: 400
    type: invalid_request_error
  insufficient_funds:
    status: 402
    type: billing_error
  price_profile_forbidden:
    status: 403
    type: permission_error
  contributor_models_off:
    status: 403
    type: permission_error
  zdr_model_required:
    status: 403
    type: permission_error
  model_not_found:
    status: 404
    type: not_found_error
  model_not_served:
    status: 404
    type: not_found_error
  price_profile_not_found:
    status: 404
    type: not_found_error
  price_profile_archived:
    status: 409
    type: invalid_request_error
  price_profile_unpriced:
    status: 409
    type: invalid_request_error
  rate_limited:
    status: 429
    type: rate_limit_error
  inconsistent_upstream:
    status: 502
    type: api_error
  unavailable:
    status: 503
    type: api_error
  price_profile_unavailable:
    status: 503
    type: api_error
  timeout:
    status: 504
    type: timeout_error
  capacity:
    status: 529
    type: overloaded_error
paths:
  /v1/routes:
    post:
      operationId: routeLookup
      summary: Route a request
      description: One encode; the Swift and Sage presets always, plus the custom result at routing.v_value. Billed once
        at the Routes API encode rate. Never trained on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoutesRequest'
            example:
              model: arc-swift-1.0
              messages:
              - role: user
                content: Explain how a database index works.
      responses:
        '200':
          description: The route and its alternatives.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutesResponse'
        '400':
          description: 'Error; `error.code` is one of: arc_model_required, invalid_body, models_invalid, no_candidate_models,
            price_leg_invalid, price_profile_invalid, prices_invalid, routing_invalid, routing_unknown_member, temperature_invalid,
            tier_value_immutable, unknown_model, unknown_price_model, value_invalid, value_not_accepted, value_out_of_bounds,
            value_required.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '402':
          description: 'Error; `error.code` is one of: insufficient_funds.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 'Error; `error.code` is one of: contributor_models_off, price_profile_forbidden, zdr_model_required.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 'Error; `error.code` is one of: model_not_found, model_not_served, price_profile_not_found.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 'Error; `error.code` is one of: price_profile_archived, price_profile_unpriced.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'Error; `error.code` is one of: rate_limited.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: 'Error; `error.code` is one of: inconsistent_upstream.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: 'Error; `error.code` is one of: price_profile_unavailable, unavailable.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '504':
          description: 'Error; `error.code` is one of: timeout.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '529':
          description: 'Error; `error.code` is one of: capacity.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/systemone:
    post:
      operationId: systemone
      summary: Ask typed questions about a state
      description: 'ARC answers up to 16 typed questions (`noul`, `choice`, `score`) about one `state` in one request,
        and generates no text. The path and body match TypeSafe''s API; `POST /v1/decisions` is the same endpoint.
        Billed on `usage.input_tokens` (the state plus every question) at the named model ID''s rate; there is no
        output charge and refused requests are not billed. Errors use TypeSafe''s bodies, `{"detail": "<message>"}`
        and on `422` `{"detail": [{"loc", "msg", "type"}]}`, with the error code in the `x-rayline-error-code` header.
        Rate limit: 30 requests per minute per user, counted separately from the Routes API. Priced the same as the
        Routes API.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionsRequest'
            example:
              model: arc-decisions-0.1
              state: I've been charged for a plan I cancelled last month. Please refund it.
              questions:
                category:
                  type: choice
                  instructions: Which support queue should handle this message?
                  criteria:
                    billing: Charges, invoices, refunds and plans
                    technical: Bugs, errors and outages
                    account: Sign-in, passwords and profile settings
                    feedback: Feature requests and general comments
      responses:
        '200':
          description: One answer per question, keyed by the question's ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionsResponse'
              example:
                model: arc-decisions-0.1
                answers:
                  category:
                    type: choice
                    choice: billing
                    confidence: 0.85
                    probabilities:
                      billing: 0.89
                      technical: 0.04
                      account: 0.03
                      feedback: 0.04
                usage:
                  input_tokens: 90
                  output_tokens: 0
        '400':
          description: '`invalid_body`: the body has no `state` or no `questions`, has a member other than `model`, `state` and `questions`, or a `state` message has no string `role`. A body that is not JSON at all is refused with `400` and no JSON body. On `/v1/decisions` only, a body without `questions` is `use_routes_endpoint`, in the Anthropic envelope.'
          headers:
            x-rayline-error-code:
              $ref: '#/components/headers/RaylineErrorCode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionsError'
              example:
                detail: 'Invalid request body: state.'
        '401':
          description: '`authentication_error`: the key is missing or invalid.'
          headers:
            x-rayline-error-code:
              $ref: '#/components/headers/RaylineErrorCode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionsError'
              example:
                detail: Invalid credentials.
        '402':
          description: '`billing_error`: the workspace has no balance to pay for the request; the message links to the top-up page.'
          headers:
            x-rayline-error-code:
              $ref: '#/components/headers/RaylineErrorCode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionsError'
        '403':
          description: '`zdr_model_required` (the organization uses zero data retention; the message names the ID to use), `contributor_models_off` (a Contributor ID while Allow Contributor models is off) or `model_not_allowed` (the organization''s data mode does not allow the request right now; the state was not sent).'
          headers:
            x-rayline-error-code:
              $ref: '#/components/headers/RaylineErrorCode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionsError'
        '404':
          description: '`model_not_found`: `model` is not a Decisions model ID; `arc-1.0`, `arc-swift-1.0`, `arc-sage-1.0` and their data-mode IDs included. `decisions_not_available`: the Decisions API is not enabled on this host.'
          headers:
            x-rayline-error-code:
              $ref: '#/components/headers/RaylineErrorCode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionsError'
              example:
                detail: Model arc-swift-1.0 is not served on ARC Decisions. Name model "arc-decisions-0.1", or its Contributor or Zero data retention entry.
        '422':
          description: 'A validation error; `type` is the code: `missing` or `string_type` (`model`), `invalid_question` (more than 16 questions, an empty or malformed `questions`, an unknown type or member, bad `criteria`, or a question over 8,192 tokens), `question_type_not_supported` (a `box` question or `assets`) or `state_too_long` (the state plus its longest question is over 32,768 tokens).'
          headers:
            x-rayline-error-code:
              $ref: '#/components/headers/RaylineErrorCode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionsValidationError'
              example:
                detail:
                - loc:
                  - body
                  - state
                  msg: state is 65429 tokens; at most 32768 are read
                  type: state_too_long
        '429':
          description: '`rate_limited` (the `Retry-After` header gives the wait) or `capacity` (retry after `Retry-After` when sent, otherwise with backoff).'
          headers:
            x-rayline-error-code:
              $ref: '#/components/headers/RaylineErrorCode'
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionsError'
              example:
                detail: Too many requests. Retry after 33 seconds.
        '503':
          description: '`question_head_unavailable`: temporarily unavailable. While ARC is starting up, the response carries `Retry-After: 30`.'
          headers:
            x-rayline-error-code:
              $ref: '#/components/headers/RaylineErrorCode'
            Retry-After:
              description: Seconds to wait before retrying, sent while ARC is starting up.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionsError'
              example:
                detail: ARC Decisions is temporarily unavailable. Retry shortly.
  /v1/messages:
    post:
      operationId: createMessage
      summary: Anthropic Messages
      description: Anthropic Messages request format with ARC model selection. The body schema below lists ARC-specific fields; include the Messages fields shown in the example.
      parameters:
      - name: anthropic-version
        in: header
        required: true
        schema:
          type: string
          default: '2023-06-01'
        example: '2023-06-01'
      x-arc-extension-only: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerationRequestExtension'
            example:
              model: arc-swift-1.0
              max_tokens: 1024
              messages:
              - role: user
                content: Explain how a database index works.
      responses:
        '200':
          description: The protocol's own response, unchanged.
        '400':
          description: 'Error; `error.code` is one of: invalid_body, routes_only_member, routing_invalid, routing_unknown_member,
            temperature_invalid, tier_value_immutable, value_invalid, value_not_accepted, value_out_of_bounds, value_required.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 'Error; `error.code` is one of: contributor_models_off, zdr_model_required.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 'Error; `error.code` is one of: model_not_found, model_not_served.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      summary: OpenAI Chat Completions
      description: OpenAI Chat Completions request format with ARC model selection. The body schema below lists ARC-specific fields; include messages as shown in the example.
      x-arc-extension-only: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerationRequestExtension'
            example:
              model: arc-swift-1.0
              messages:
              - role: user
                content: Explain how a database index works.
      responses:
        '200':
          description: The protocol's own response, unchanged.
        '400':
          description: 'Error; `error.code` is one of: invalid_body, routes_only_member, routing_invalid, routing_unknown_member,
            temperature_invalid, tier_value_immutable, value_invalid, value_not_accepted, value_out_of_bounds, value_required.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 'Error; `error.code` is one of: contributor_models_off, zdr_model_required.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 'Error; `error.code` is one of: model_not_found, model_not_served.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/responses:
    post:
      operationId: createResponse
      summary: OpenAI Responses
      description: OpenAI Responses request format with ARC model selection. Availability is rolling out; consult the ARC compatibility guide before choosing this endpoint. The body schema below lists ARC-specific fields; include input as shown in the example.
      x-arc-extension-only: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerationRequestExtension'
            example:
              model: arc-swift-1.0
              input: Explain how a database index works.
      responses:
        '200':
          description: The protocol's own response, unchanged.
        '400':
          description: 'Error; `error.code` is one of: invalid_body, routes_only_member, routing_invalid, routing_unknown_member,
            temperature_invalid, tier_value_immutable, value_invalid, value_not_accepted, value_out_of_bounds, value_required.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 'Error; `error.code` is one of: contributor_models_off, zdr_model_required.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 'Error; `error.code` is one of: model_not_found, model_not_served.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  headers:
    RaylineErrorCode:
      description: The Decisions error code, such as `model_not_found` or `rate_limited`.
      schema:
        type: string
  securitySchemes:
    raylineApiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: Your Rayline API key.
  schemas:
    Alternative:
      additionalProperties: false
      properties:
        model:
          minLength: 1
          title: Model
          type: string
        worker:
          minLength: 1
          title: Worker
          type: string
        provider:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Provider
        score:
          description: 'The number ARC ranked this worker by for the route: higher is better. No fixed range; compare only within one response, since each checkpoint scores on its own scale.'
          title: Score
          type: number
      required:
      - model
      - worker
      - score
      title: Alternative
      type: object
    Baseline:
      additionalProperties: false
      properties:
        input:
          minimum: 0
          title: Input
          type: number
        cache_read:
          minimum: 0
          title: Cache Read
          type: number
        cache_write:
          minimum: 0
          title: Cache Write
          type: number
        output:
          minimum: 0
          title: Output
          type: number
        model:
          minLength: 1
          title: Model
          type: string
      required:
      - input
      - cache_read
      - cache_write
      - output
      - model
      title: Baseline
      type: object
    CandidatePi:
      additionalProperties: false
      properties:
        model:
          minLength: 1
          title: Model
          type: string
        pi:
          maximum: 1
          minimum: 0
          title: Pi
          type: number
      required:
      - model
      - pi
      title: CandidatePi
      type: object
    RoutesRouting:
      additionalProperties: false
      description: '``routing`` on ``POST /v1/routes``.'
      properties:
        v_value:
          maximum: 30.0
          minimum: 0.1
          type: number
          description: 'The caller''s V: the USD value of one successful result. Adds the `custom` result. Never clamped.
            Required with an ARC Dynamic id (`value_required`); refused with a tier id (`tier_value_immutable`).'
          title: V Value
          x-status: proposed
        temperature:
          minimum: 0
          type: number
          description: A softmax temperature over each result's normalized Stage-1 scores. Uncapped here; 0 is greedy.
          title: Temperature
          x-status: proposed
        prices:
          additionalProperties:
            $ref: '#/components/schemas/PriceLegs'
          maxProperties: 256
          minProperties: 1
          type: object
          description: BYO prices per exact served model id; each leg is optional and an unset leg keeps its profile or
            catalog price. They change selection only, never the candidates or the Routes API charge. Takes precedence over
            `price_profile`.
          title: Prices
          x-status: proposed
        models:
          items:
            minLength: 1
            type: string
          maxItems: 256
          type: array
          description: 'The candidate models: exact served model ids or patterns where `*` matches any run of characters.
            Case-sensitive. A hard limit: without it every selectable model is a candidate. An entry that matches no model
            is `unknown_model`.'
          title: Models
          x-status: proposed
        excluded_models:
          items:
            minLength: 1
            type: string
          maxItems: 256
          type: array
          description: Exact served model ids or `*` patterns removed from the candidates. Wins over `models`. Nothing left
            is `no_candidate_models`.
          title: Excluded Models
          x-status: proposed
        price_profile:
          $ref: '#/components/schemas/PriceProfileRef'
          description: A saved price profile. Combinable with `prices`, which wins per model and leg.
          title: Price Profile
          x-status: proposed
      title: RoutesRouting
      type: object
      x-status: proposed
    EchoStatus:
      additionalProperties: false
      properties:
        requested:
          title: Requested
        status:
          enum:
          - applied
          - unsupported
          title: Status
          type: string
      required:
      - requested
      - status
      title: EchoStatus
      type: object
    EncodeUsage:
      additionalProperties: false
      description: 'The request''s one shared encode: billed once at the Routes API rate however many results it returns.'
      properties:
        encoded_input_tokens:
          minimum: 0
          title: Encoded Input Tokens
          type: integer
        cache_read_tokens:
          minimum: 0
          title: Cache Read Tokens
          type: integer
      required:
      - encoded_input_tokens
      - cache_read_tokens
      title: EncodeUsage
      type: object
    Episode:
      additionalProperties: false
      properties:
        turn_index:
          minimum: 0
          title: Turn Index
          type: integer
        stayed:
          title: Stayed
          type: boolean
      required:
      - turn_index
      - stayed
      title: Episode
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        type:
          minLength: 1
          title: Type
          type: string
        message:
          title: Message
          type: string
        code:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Code
          x-status: proposed
      required:
      - type
      - message
      title: ErrorDetail
      type: object
    ErrorEnvelope:
      additionalProperties: false
      description: Every error, in the Anthropic envelope the router already answers with.
      properties:
        type:
          const: error
          title: Type
          type: string
        error:
          $ref: '#/components/schemas/ErrorDetail'
      required:
      - type
      - error
      title: ErrorEnvelope
      type: object
    GenerationRequestExtension:
      type: object
      required:
      - model
      additionalProperties: true
      description: The protocol's own request; only the ARC extension members are specified here.
      properties:
        model:
          type: string
        routing:
          $ref: '#/components/schemas/GenerationRouting'
    GenerationRouting:
      additionalProperties: false
      description: '``routing`` on generation requests. ``v_value`` is required with an ARC Dynamic id (``value_required``)
        and refused with a tier id (``tier_value_immutable``) or any other model (``value_not_accepted``).'
      properties:
        v_value:
          maximum: 30.0
          minimum: 0.1
          type: number
          title: V Value
          x-status: proposed
        temperature:
          minimum: 0
          type: number
          description: Hosted exploration temperature. Capped by the deployment and applied only when the org's data policy
            allows training; otherwise echoed `unsupported`.
          title: Temperature
          x-status: proposed
      title: GenerationRouting
      type: object
      x-status: proposed
    Presets:
      additionalProperties: false
      properties:
        swift:
          $ref: '#/components/schemas/RouteResult'
        sage:
          $ref: '#/components/schemas/RouteResult'
      required:
      - swift
      - sage
      title: Presets
      type: object
      x-status: proposed
    PriceLegs:
      additionalProperties: false
      description: USD per million tokens. Each leg is optional, but at least one is required; 0 is a price.
      minProperties: 1
      properties:
        input:
          minimum: 0
          title: Input
          type: number
        cache_read:
          minimum: 0
          title: Cache Read
          type: number
        cache_write:
          minimum: 0
          title: Cache Write
          type: number
        output:
          minimum: 0
          title: Output
          type: number
      title: PriceLegs
      type: object
    ProfilePrice:
      additionalProperties: false
      description: One model's price as the profile resolved it, USD per million tokens. A model the profile cannot price on every leg is listed in `unpriced` instead.
      properties:
        input:
          minimum: 0
