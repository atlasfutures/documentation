            read as a conversation, one block per message after an optional top-level `system`; each message needs a
            string `role`, and its `content` is read as is when it is a string and as JSON text otherwise. Any other
            value is read as one user message. The state plus its longest question must fit within 32,768 tokens.'
        questions:
          additionalProperties:
            $ref: '#/components/schemas/DecisionsQuestion'
          description: 1 to 16 questions, keyed by an ID you choose (a non-empty string). Each answer comes back under
            its question's ID.
          maxProperties: 16
          minProperties: 1
